---
layout: default
---
<style>
  /* Fill everything to the right of Hyde's fixed sidebar */
  body { overflow: hidden; }
  .content.container {
    position: fixed;
    top: 0; right: 0; bottom: 0; left: 0;
    padding: 0 !important;
    max-width: none !important;
    margin: 0 !important;
    display: flex;
    overflow: hidden;
  }
  /* Match Hyde's sidebar breakpoints */
  @media (min-width: 48em) {
    .content.container { left: 20rem; }
  }
  @media (min-width: 64em) {
    .content.container { left: 22rem; }
  }
</style>
